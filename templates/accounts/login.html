<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Its Digital</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* Apply Inter font family globally */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary/20 via-secondary/20 to-accent/20 min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-100 shadow-2xl">
        <div class="card-body">
            <div class="text-center mb-6">
                <div class="flex justify-center mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="Its Digital" class="h-16" />
                </div>
                {% comment %} <h2 class="text-3xl font-bold text-base-content">Its Digital Login</h2> {% endcomment %}
                <p class="text-base-content/60 mt-2">Sign in to your account</p>
            </div>
            
            {% if form.errors %}
            <div class="alert alert-error mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Invalid username or password.</span>
            </div>
            {% endif %}
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="form-control">
                    <label class="label" for="id_username">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" 
                           id="id_username" 
                           name="username" 
                           class="input input-bordered w-full" 
                           required 
                           autofocus
                           placeholder="Enter your email">
                </div>
                
                <div class="form-control">
                    <label class="label" for="id_password">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" 
                           id="id_password" 
                           name="password" 
                           class="input input-bordered w-full" 
                           required
                           placeholder="Enter your password">
                </div>
                
                
                
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                        </svg>
                        Sign In
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'accounts:password_reset' %}" class="link link-primary text-sm">Forgot password?</a>
            </div>
        </div>
    </div>
</body>
</html>
