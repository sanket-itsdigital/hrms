<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Its Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <style> * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-primary/20 via-secondary/20 to-accent/20 min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-100 shadow-2xl">
        <div class="card-body">
            <div class="text-center mb-6">
                <div class="flex justify-center mb-4">
                    <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                </div>
                <h2 class="text-3xl font-bold text-base-content">Password Reset</h2>
                <p class="text-base-content/60 mt-2">Enter your account email to receive reset instructions</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-error mb-4">
                <span>Please enter a valid email address.</span>
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="form-control">
                    <label class="label" for="id_email">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email"
                           id="id_email"
                           name="email"
                           class="input input-bordered w-full"
                           required
                           placeholder="Enter your email">
                </div>

                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">Send Reset Email</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'accounts:login' %}" class="link link-primary text-sm">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
