{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Event - Its Digital{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card shadow-xl">
        <div class="card-body">
            <div class="alert alert-warning mb-6">
                <span>Are you sure you want to delete this event?</span>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-lg mb-6">
                <h3 class="font-semibold text-lg mb-2">{{ event.title }}</h3>
                <p class="text-gray-600 text-sm">{{ event.start_date|date:"M d, Y H:i" }}</p>
            </div>
            
            <form method="post" class="flex justify-end gap-4">
                {% csrf_token %}
                <a href="{% url 'company:events_list' %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-error">Delete Event</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
